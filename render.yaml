services:
  - type: web
    name: revizy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # sync: false = ne pas écraser la valeur définie dans le dashboard Render.
      # Ces variables doivent être remplies manuellement (secrets), voir DEPLOY.md.
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_PUBLIC_KEY
        sync: false
      - key: FEDAPAY_CURRENCY
        value: XOF
      - key: JWT_SECRET
        sync: false
      # Le modèle et sa chaîne de secours sont définis par défaut dans
      # server.js (gemini-3.5-flash-lite + replis). Ne pas les figer ici :
      # une valeur figée réactive le problème de quota (20 requêtes/jour).
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_FALLBACK_MODELS
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: APP_BASE_URL_FRONT
        sync: false
      # ── Pilotage du quota IA ──────────────────────────────────────
      # Le quota gratuit Google n'est pas extensible (20 req/JOUR sur les
      # modèles flash standard, ~1 500/JOUR sur les flash-lite). Le serveur
      # applique donc ses propres plafonds, toujours en dessous du réel, et
      # bascule sur le cache durable / le contenu local quand ils sont
      # atteints (aucune erreur 502 pour l'élève).
      - key: AI_BUDGET_QUOTIDIEN
        value: "200"     # appels IA maximum par fenêtre glissante de 24 h
      - key: AI_BUDGET_PAR_MODELE
        value: "15"      # modèles flash standard (quota Google 20/j)
      - key: AI_BUDGET_PAR_MODELE_LITE
        value: "150"     # modèles flash-lite (quota Google ~1 500/j)
      - key: AI_BUDGET_SANTE
        value: "12"      # requêtes réservées au diagnostic /v1/ai/health
      - key: AI_BUDGET_SANTE_PAR_MODELE
        value: "3"
      - key: AI_CACHE_TTL_JOURS
        value: "30"      # durée de vie du cache IA sur disque
      - key: AI_CACHE_MEMOIRE_MINUTES
        value: "720"     # cache mémoire (12 h)
      # ── Double authentification de l'administration ────────────────
      # « on » = l'espace admin exige un code TOTP en plus du mot de passe.
      # Passer à « off » uniquement pour la dépannage (avant d'activer le
      # TOTP dans Supabase : Authentication → Sign In / Providers → MFA).
      - key: ADMIN_MFA_REQUIS
        value: "on"