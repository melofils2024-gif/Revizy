services:
  - type: web
    name: revizy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # sync: false = ne pas écraser la valeur définie dans le dashboard Render.
      # Ces variables doivent être remplies manuellement (secrets), voir DEPLOY.md.
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_PUBLIC_KEY
        sync: false
      - key: FEDAPAY_CURRENCY
        value: XOF
      - key: JWT_SECRET
        sync: false
      # Le modèle et sa chaîne de secours sont définis par défaut dans
      # server.js (gemini-3.5-flash-lite + replis). Ne pas les figer ici :
      # une valeur figée réactive le problème de quota (20 requêtes/jour).
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_FALLBACK_MODELS
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: APP_BASE_URL_FRONT
        sync: false
      # ── Pilotage du quota IA ──────────────────────────────────────
      # Le quota gratuit Google (20 req/JOUR et par modèle) n'est pas
      # extensible : le serveur applique donc ses propres plafonds et
      # bascule sur le cache durable / le contenu local quand ils sont
      # atteints (aucune erreur 502 pour l'élève).
      - key: AI_BUDGET_QUOTIDIEN
        value: "45"      # appels IA maximum par fenêtre glissante de 24 h
      - key: AI_BUDGET_PAR_MODELE
        value: "15"      # par modèle et par fenêtre de 24 h
      - key: AI_BUDGET_SANTE
        value: "12"      # requêtes réservées au diagnostic /v1/ai/health
      - key: AI_BUDGET_SANTE_PAR_MODELE
        value: "3"
      - key: AI_CACHE_TTL_JOURS
        value: "30"      # durée de vie du cache IA sur disque
      - key: AI_CACHE_MEMOIRE_MINUTES
        value: "720"     # cache mémoire (12 h)