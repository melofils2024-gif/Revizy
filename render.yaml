services:
  - type: web
    name: revizy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # sync: false = ne pas écraser la valeur définie dans le dashboard Render.
      # Ces variables doivent être remplies manuellement (secrets), voir DEPLOY.md.
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FEDAPAY_SECRET_KEY
        sync: false
      - key: FEDAPAY_PUBLIC_KEY
        sync: false
      - key: FEDAPAY_CURRENCY
        value: XOF
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_FALLBACK_MODELS
        value: gemini-3.8-flash